[project]
name = "model-server"
version = "0.1.0"
description = "OpenAI-compatible local model server for SkillVault TEE"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[project.scripts]
model-server = "model_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
